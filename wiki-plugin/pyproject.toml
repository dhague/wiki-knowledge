[project]
name = "wiki-knowledge"
version = "0.1.0"
description = "Test tooling for the wiki-knowledge plugin."
requires-python = ">=3.10"
# The runtime script layer is TypeScript (ADR-0017). Nothing Python is shipped
# or run at install time any more: the per-host installers (the OpenCode trio
# and generate-dsh-bundle.py) and their `ruamel.yaml` dependency were deleted
# with ADR-0026. What remains is the structural pytest suite under tests/.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pyright",         # static type checking — run `<venv python> -m pyright` (#130)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
