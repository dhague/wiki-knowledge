[project]
name = "wiki-knowledge"
version = "0.1.0"
description = "Install-time tooling for the wiki-knowledge plugin (OpenCode and DeepSeek Harness)."
requires-python = ">=3.10"
# The runtime script layer is TypeScript (ADR-0017). What remains here is
# install-time only — the OpenCode generate/install/assemble scripts and
# generate-dsh-bundle.py, which a person runs once to wire the plugin into an
# OpenCode vault or a DeepSeek Harness profile.
dependencies = [
    "ruamel.yaml",     # round-trip agent/command frontmatter — NOT pyyaml (pyyaml coerces types / loses formatting)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyright",         # static type checking — run `<venv python> -m pyright` (#130)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
